services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sanin_legacy_development
      POSTGRES_USER: sanin_legacy
      POSTGRES_PASSWORD: development_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port configuration: Override DB_PORT environment variable for worktree isolation
    # Default: 5432 (main branch), can be overridden in .env for worktree instances
    # Set automatically by scripts/create_worktree.sh
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanin_legacy -d sanin_legacy_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    command: bash -c "bundle exec rails db:prepare && bundle exec rails tailwindcss:build && bundle exec rails server -b 0.0.0.0 -p 3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    user: "${UID:-1000}:${GID:-1000}"
    # Port configuration: Override APP_PORT environment variable for worktree isolation
    # Default: 3000 (main branch), can be overridden in .env for worktree instances
    # Set automatically by scripts/create_worktree.sh
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanin_legacy:development_password@db:5432/sanin_legacy_development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: sanin_legacy
      DATABASE_PASSWORD: development_password
      RAILS_ENV: development
      SELENIUM_MANAGER_CACHE: /home/rails/.cache/selenium
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle:
    # NOTE: If you encounter permission errors when running `bundle install`,
    # it may be due to an existing bundle volume created with root permissions.
    # In that case, remove the old volume and recreate it:
    #   docker volume rm sanin-legacy_bundle
    #   docker compose up --build
