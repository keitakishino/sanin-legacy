# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# ActionCable/Solid Cable is not used anywhere in this app (no app/channels, no turbo_stream_from,
# no broadcasts_to). Using the async adapter avoids needing a separate "cable" database.
# If real-time broadcasting is ever needed, switch back to solid_cable and add a proper
# `cable` entry to config/database.yml (see db/cable_schema.rb in git history / regenerate via
# `bin/rails generate solid_cable:install`).
production:
  adapter: async
