services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sanin_legacy_development
      POSTGRES_USER: sanin_legacy
      POSTGRES_PASSWORD: development_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanin_legacy"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: bash -c "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0 -p 3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanin_legacy:development_password@db:5432/sanin_legacy_development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: sanin_legacy
      DATABASE_PASSWORD: development_password
      RAILS_ENV: development
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle:
