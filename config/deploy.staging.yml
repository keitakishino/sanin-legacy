# Name of your application. Used to uniquely configure containers.
service: sanin-legacy-staging

# Name of the container image (use your-user/app-name on external registries).
# Placeholder: Replace <Docker Hub ユーザー名> with your actual Docker Hub username
image: "keitakishino/sanin_legacy"

# Deploy to these servers.
# Placeholder: Replace <本番サーバーIP> with your actual staging server IP address
# Note: This can be the same server as production when using Kamal destination feature
servers:
  web:
    - 49.212.128.192
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
proxy:
  ssl: true
  host: staging.sanin-legacy.win

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: docker.io

  # Needed for authenticated registries.
  # Placeholder: Replace <Docker Hub ユーザー名> with your actual Docker Hub username
  username: "keitakishino"

  # Always use an access token rather than real password when possible.
  password: <%= ENV['KAMAL_REGISTRY_PASSWORD'] %>

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_HOST
    - DATABASE_USER
    - DATABASE_PASSWORD
    - DATABASE_PORT
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
    - TWITTER_OAUTH_API_KEY
    - TWITTER_OAUTH_API_SECRET
    - KAMAL_REGISTRY_PASSWORD
  # Note: DATABASE_HOST, DATABASE_USER, DATABASE_PASSWORD, and DATABASE_PORT are injected into the Rails app container.
  # These correspond to values defined in .kamal/secrets and are required by config/database.yml in production.
  # POSTGRES_PASSWORD for the PostgreSQL accessory is mapped from DATABASE_PASSWORD using Kamal's secret aliasing syntax.
  clear: {}
    # Solid Queue is not used by this app yet (config.active_job.queue_adapter = :async).
    # Re-enable once background jobs are actually needed, alongside a proper `queue` database.
    # SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # DATABASE_HOST, DATABASE_USER, DATABASE_PORT are injected via env.secret
    # and are required by Rails config/database.yml for production database connectivity.
    # This DB_HOST variable (clear env) is for optional debugging/override use. In normal operation, DATABASE_HOST
    # from env.secret controls the database connection. Uncomment only if an alternative host is explicitly needed.
    # DB_HOST: sanin-legacy-staging-db

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "sanin-legacy-staging_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.3.12
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
ssh:
  user: ubuntu

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:17-alpine
    # Placeholder: Replace <本番サーバーIP> with your actual staging server IP address
    # Note: This can be the same server as production when using Kamal destination feature
    host: 49.212.128.192
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        # POSTGRES_USER/POSTGRES_DB must match the Rails app's DATABASE_USER and expected database name
        # (config/database.yml production default: sanin_legacy_production), otherwise the postgres image
        # initializes with the default "postgres" user/db and the app can't authenticate.
        POSTGRES_USER: sanin_legacy
        POSTGRES_DB: sanin_legacy_production
      secret:
        # POSTGRES_PASSWORD is mapped from DATABASE_PASSWORD using Kamal's secret aliasing syntax.
        # This allows the PostgreSQL container to receive the database password under its expected environment variable name.
        - POSTGRES_PASSWORD:DATABASE_PASSWORD
    volumes:
      - data-staging:/var/lib/postgresql/data
